version: '3.8'

services:
  # DB service
  db:
    container_name: liga-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: brunobrsr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  # Backend service
  backend:
    build: ./Backend
    container_name: liga-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: brunobrsr
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    restart: always

  # Frontend service
  frontend:
    build: ./Frontend
    container_name: liga-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data: